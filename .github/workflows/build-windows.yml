name: Build Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Check Flutter Version
        run: flutter doctor -v

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Windows Desktop
        run: flutter build windows --release

      - name: Package Windows Binary
        shell: pwsh
        run: |
          $buildDir = "build\windows\x64\runner\Release"
          $packageDir = "Cek-PBB-Cianjur-Windows-x64"
          $zipName = "Cek-PBB-Cianjur-Windows-x64.zip"

          # Buat folder distribusi
          New-Item -ItemType Directory -Force -Path $packageDir

          # Salin seluruh berkas biner dan aset dependensi
          Copy-Item -Path "$buildDir\*" -Destination $packageDir -Recurse

          # Arsipkan menjadi berkas zip portabel
          Compress-Archive -Path "$packageDir\*" -DestinationPath $zipName -Force

          Write-Host "Paket rilis Windows berhasil dibuat: $zipName"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build Inno Setup Installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe"
          }
          if (Test-Path $iscc) {
            Write-Host "Compiling Inno Setup installer..."
            & $iscc "windows\installer.iss"
            Write-Host "Inno Setup installer created successfully."
          } else {
            Write-Host "ISCC compiler not found, skipping installer EXE."
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cek-PBB-Cianjur-Windows-Release
          path: |
            Cek-PBB-Cianjur-Windows-x64.zip
            build/*.exe
          retention-days: 14

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Cek-PBB-Cianjur-Windows-x64.zip
            build/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


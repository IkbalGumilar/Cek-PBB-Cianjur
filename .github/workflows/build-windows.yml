name: Build Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Check Flutter Version
        run: flutter doctor -v

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Static Analysis
        run: flutter analyze

      - name: Run Unit & Widget Tests
        run: flutter test

      - name: Build Windows Desktop
        run: |
          if (-not (Test-Path "build\native_assets\windows")) {
            New-Item -ItemType Directory -Force -Path "build\native_assets\windows" | Out-Null
          }
          flutter build windows --release --obfuscate --split-debug-info=build\symbols\windows --tree-shake-icons

      - name: Package Windows Binary
        shell: pwsh
        run: |
          $buildDir = "build\windows\x64\runner\Release"
          $packageDir = "Cek-PBB-Cianjur-Windows-x64"
          $zipName = "Cek-PBB-Cianjur-Windows-x64.zip"

          # Bersihkan residu debug/linker agar biner rilis ramping dan bersih
          Get-ChildItem -Path $buildDir -Recurse -Include *.pdb,*.ilk,*.exp,*.lib,*.obj,kernel_blob.bin -File | Remove-Item -Force

          # Buat folder distribusi
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null

          # Salin seluruh berkas biner dan aset dependensi
          Copy-Item -Path "$buildDir\*" -Destination $packageDir -Recurse -Force

          # Arsipkan menjadi berkas zip portabel
          Compress-Archive -Path "$packageDir\*" -DestinationPath $zipName -Force

          $dirMb = [math]::Round(((Get-ChildItem $buildDir -Recurse -File | Measure-Object Length -Sum).Sum / 1MB), 2)
          $zipMb = [math]::Round(((Get-Item $zipName).Length / 1MB), 2)
          Write-Host "Paket rilis Windows berhasil dibuat: $zipName ($zipMb MB, Release dir: $dirMb MB)"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build Inno Setup Installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe"
          }
          if (Test-Path $iscc) {
            Write-Host "Compiling Inno Setup installer..."
            & $iscc "windows\installer.iss"
            Write-Host "Inno Setup installer created successfully."
          } else {
            Write-Host "ISCC compiler not found, skipping installer EXE."
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cek-PBB-Cianjur-Windows-Release
          path: |
            Cek-PBB-Cianjur-Windows-x64.zip
            build/*.exe
          retention-days: 14

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Cek-PBB-Cianjur-Windows-x64.zip
            build/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

